name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify Python syntax
        run: |
          python -c "
          import ast
          for f in [
            'src/calculator/__init__.py',
            'src/calculator/core.py',
            'src/greeks.py',
            'src/ntsl.py',
            'scripts/export_v1_data.py',
          ]:
            ast.parse(open(f, encoding='utf-8').read())
            print(f'OK: {f}')
          "

      - name: Run test suite
        run: |
          python tests/run_all.py

      - name: Run specific test groups (optional)
        run: |
          python tests/run_all.py --quick

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded paths
        run: |
          if grep -r "C:\\\\Users\\\\" --include="*.py" --include="*.js" --include="*.html" src/ scripts/ tests/ 2>/dev/null; then
            echo "ERROR: Hardcoded Windows paths detected"
            exit 1
          fi
          echo "OK: No hardcoded paths in src/, scripts/, tests/"

      - name: Check for TODOs in critical files
        run: |
          # Apenas warnings, nao bloqueia
          if grep -rn "TODO\|FIXME\|XXX" --include="*.py" src/calculator/ src/greeks.py 2>/dev/null; then
            echo "WARNING: TODOs in critical files (nao bloqueia)"
          fi
