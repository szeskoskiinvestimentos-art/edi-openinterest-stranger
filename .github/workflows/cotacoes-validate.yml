name: Cotacoes - Validate

on:
  push:
    paths:
      - "Cotacoes/**"
      - ".github/workflows/cotacoes-validate.yml"
  pull_request:
    paths:
      - "Cotacoes/**"
      - ".github/workflows/cotacoes-validate.yml"

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (Cotacoes)
        run: npm -C Cotacoes ci

      - name: TypeScript check
        run: npm -C Cotacoes run -s check

      - name: Strict artifacts validation
        run: npm -C Cotacoes run -s market:validate:strict
