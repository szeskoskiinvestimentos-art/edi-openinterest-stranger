---
# Pre-commit hook para EDI Market Guardian
# Instalar: pip install pre-commit && pre-commit install
# Rodar manualmente: pre-commit run --all-files
#
# Skip se necessario: git commit --no-verify
repos:
  - repo: local
    hooks:
      - id: edi-tests
        name: EDI Test Suite (run_all.py)
        entry: python tests/run_all.py --quick
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        # So bloqueia se exit != 0
      - id: dashboard-shared-guard
        name: EDI Dashboard shared/ guard (E95b-prevention 2026-06-21)
        description: Bloqueia commit se shared/js ou shared/css tiver arquivos deletados
        entry: python scripts/hooks/check_dashboard_shared.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dashboard-unified-restore
        name: EDI Dashboard unified (aviso se working tree dirty)
        description: Avisa se dashboard_unificado/ tem mudancas nao commitadas
        entry: python scripts/hooks/check_dashboard_unified.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
