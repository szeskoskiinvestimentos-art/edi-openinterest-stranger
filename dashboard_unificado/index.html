<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Dashboard Unificado WDO/WIN</title>
  <style>
    body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;background:#0b0b0b;color:#e0e0e0;margin:0}
    .header{display:flex;justify-content:space-between;align-items:flex-end;padding:16px 24px;background:#0b0b0b;border-bottom:2px solid #ff2255;position:sticky;top:0;z-index:10}
    .brand-title{color:#ff2255;letter-spacing:2px;font-weight:800;font-size:24px;text-shadow:0 0 6px rgba(255,34,85,.6)}
    .brand-sub{color:#55e6ff;font-weight:700;font-size:12px;letter-spacing:2px;margin-top:4px}
    .menu{display:flex;gap:12px;align-items:flex-end}
    .asset-select{background:#141414;color:#e0e0e0;border:1px solid #333;padding:8px 12px;border-radius:4px;font-weight:700}
    .asset-select:focus{outline:none;border-color:#55e6ff;box-shadow:0 0 0 2px rgba(85,230,255,.2)}
    .container{height:calc(100vh - 60px)}
    iframe{width:100%;height:100%;border:0;display:none;background:#0e0e0e}
    iframe.active{display:block}
  </style>
</head>
<body>
  <main class="container">
    <iframe id="frameWDO" class="active" src="WDO/dashboard_v1/index.html"></iframe>
    <iframe id="frameWIN" src="../dashboard_v1/index.html"></iframe>
  </main>
</body>
</html>
