<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dashboard Unificado WDO/WIN</title>
  <style>
    body{margin:0;background:#0b0b0b;height:100vh}
    .shell{height:100vh;display:flex;flex-direction:column}
    .top{flex:0 0 164px;border-bottom:1px solid rgba(255,255,255,.08);background:#0b0b0b}
    .main{flex:1 1 auto;display:flex;flex-direction:row}
    .pane{flex:1 1 50%;min-width:0}
    .pane + .pane{border-left:1px solid rgba(255,255,255,.08)}
    iframe{width:100%;height:100%;border:0;display:block;background:#0e0e0e}
    @media (max-width: 980px){
      .main{flex-direction:column}
      .pane + .pane{border-left:0;border-top:1px solid rgba(255,255,255,.08)}
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <iframe id="compass"></iframe>
    </div>
    <div class="main">
      <div class="pane"><iframe id="wdo"></iframe></div>
      <div class="pane"><iframe id="win"></iframe></div>
    </div>
  </div>
  <script>
    (function(){
      const compass = document.getElementById('compass');
      const wdo = document.getElementById('wdo');
      const win = document.getElementById('win');
      if (!wdo || !win) return;
      const isFile = location.protocol === 'file:';
      const suffix = isFile ? '' : `?v=${String(Date.now())}`;
      wdo.src = `WDO/index.html${suffix}`;
      win.src = `WIN/index.html${suffix}`;
      if (compass) {
        const extra = isFile ? '' : `&v=${String(Date.now())}`;
        const base = `../Cotacoes/dashboard/MERCADO/index.html?embed=compass${extra}`;
        compass.src = base;
      }
    })();
  </script>
</body>
</html>
